<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <ul id="userList">
  </ul>
  <script>
    // const response = fetch("https://jsonplaceholder.typicode.com/users") // this includes all the metadata
    // // console.log(response);


    // const data = response.then(res => {
    //   console.log("Response: ", res);
    //   return res.json(); // used to retrieve the actual data from the response object, it also returns a promise
    // })
    // const final = data.then(res => console.log(res))
    // fetch --> url --> response --> json() --> data

    var users = [];

    fetch("https://jsonplaceholder.typicode.com/users")
    .then(res => res.json())
    .then(data => {
      console.log("Data: ", data);
      var userList = document.getElementById("userList");
      data.forEach(user => {
        let listItem = document.createElement("li");
        listItem.innerText = user.name;
        userList.appendChild(listItem);
      });
    })
    .catch(error => console.error("Error fetching data:", error));
  </script>
</body>
</html>
