<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <div class="card-group gap-2" id="product-cards">
    </div>
  </div>

  <script type="module">
    import { getProduct } from './fetchProductModule/getProduct.js';
    async function fetchProducts() {
      try {
        // const response = await fetch('https://dummyjson.com/products');
        // const data = await response.json();
        // const products = data.products;

        const products = await getProduct();

        const productCardsContainer = document.getElementById('product-cards');
        productCardsContainer.innerHTML = '';

        products.forEach(product => {
          let card = `
            <div class="col">
              <div class="card h-100 shadow-sm border-0">
                <img src="${product.thumbnail}" alt="${product.title}" class="card-img-top bg-secondary-subtle" style="height: 200px; object-fit: cover;">
                
                <div class="card-body d-flex flex-column justify-content-between">
                  
                  <div class="mb-3">
                    <h5 class="card-title text-truncate mb-0">${product.title}</h5>
                  </div>
                  
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-dark">$${product.price}</span>
                    <span class="badge bg-warning text-dark px-2 py-1">★ ${product.rating}</span>
                  </div>

                </div>
              </div>
            </div>
          `;
          productCardsContainer.innerHTML += card;
        });
      } catch (error) {
        console.error('Error fetching products:', error);
      }
    }
    fetchProducts();
  </script>
</body>
</html>
